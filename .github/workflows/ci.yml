name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Regenerate client from openapi.json
        run: make generate

      - name: Fail if the committed client is stale
        run: |
          git diff --exit-code -- client.gen.go \
            || (echo "::error::Generated client is out of date. Run 'make generate' and commit." && exit 1)

      - name: Fail if the README's version claims have drifted
        run: python3 .github/check-readme-versions.py

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run unit tests with coverage
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          slug: GetBusbar/busbar-go
          fail_ci_if_error: false
