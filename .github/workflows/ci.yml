name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Regenerate client from openapi.json
        run: make generate

      - name: Fail if the committed client is stale
        run: |
          git diff --exit-code -- client.gen.go \
            || (echo "::error::Generated client is out of date. Run 'make generate' and commit." && exit 1)

      - name: Fail if the README's version claims have drifted
        run: python3 .github/check-readme-versions.py

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Run unit tests with coverage
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          slug: GetBusbar/busbar-go
          fail_ci_if_error: false
