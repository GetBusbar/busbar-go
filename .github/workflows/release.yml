name: Release

on:
  push:
    tags:
      - "v*"

# Go modules have no registry/token: "publishing" is just the git tag, which
# makes the module `go get`-able from this repo. This job validates that the
# tagged commit regenerates cleanly and builds — no secret required.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Regenerate client from openapi.json
        run: make generate

      - name: Fail if the committed client is stale
        run: git diff --exit-code -- client.gen.go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Done
        run: echo "::notice::Tag ${GITHUB_REF_NAME} builds cleanly and is now go-gettable at github.com/GetBusbar/busbar-go@${GITHUB_REF_NAME}."
